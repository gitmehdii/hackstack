name: ci

# Porte qualité : lint + types + tests sur chaque push et PR.
# Aucun service : la suite tourne sans DB ni réseau (fixtures figées, clients mockés).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff (lint)
        run: uv run --frozen --extra dev ruff check .

      - name: Ruff (format)
        run: uv run --frozen --extra dev ruff format --check .

      - name: Mypy (strict)
        run: uv run --frozen --extra dev mypy

      - name: Pytest
        run: uv run --frozen --extra dev pytest -q

      - name: Fixtures scrubbées (pas de description intégrale)
        run: uv run --frozen python -m pipeline.contracts.scrub_fixtures --check
