# Taxonomie fermée de TECH_STACK (Étape 4).
#
# Vocabulaire contrôlé : projects.tech_stack ne contient QUE des valeurs de `canonical`.
# Plus riche que themes.yaml (le nombre de technos n'a pas le même effet de dilution que
# les thèmes), mais reste fermé. Toute valeur produite par une passe d'extraction qui
# n'est pas dans `canonical` est rejetée (cf. pipeline/normalize/taxonomy.py).
#
# `aliases` : variantes rencontrées dans les manifestes GitHub / langages / prompts LLM,
# mappées (en minuscules) vers la valeur canonique. Sert à la passe GitHub pour normaliser
# les noms de paquets et de langages détectés. La passe LLM reçoit directement la liste
# canonique et n'est censée renvoyer que ces valeurs.

version: 1

canonical:
  languages:
