# Taxonomie fermée de THÈMES (Étape 4).
#
# Volontairement PLATE et COURTE (30–50 entrées, pas de hiérarchie). Une taxonomie qui
# gonfle produit des pages /theme/[slug] avec 4 projets chacune, inutilisables. Un projet
# porte AU PLUS `max_per_project` thèmes (cf. pipeline/normalize/llm_extract.py).
#
# `slug` = identifiant stable, sert d'URL (/theme/[slug]) et de valeur dans
# projects.theme_tags. `label` + `description` : affichage et amorçage du prompt LLM.
# Ne jamais renommer un slug sans migration : c'est une clé d'URL publique.

version: 1
max_per_project: 3

themes:
