services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hackstack-db
    environment:
      POSTGRES_USER: hackstack
      POSTGRES_PASSWORD: hackstack
      POSTGRES_DB: hackstack
    ports:
      - "5433:5432"
    volumes:
      - hackstack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackstack -d hackstack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hackstack_pgdata:
